# QuantFlow Backend — Render Blueprint (Free Tier)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: quantflow-api
    env: python
    region: oregon  # US West — lowest latency to Supabase US East
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    plan: free
    # Free tier: 750 hours/month, spins down after 15 min of inactivity
    # Cold start: ~30 seconds on first request after sleep

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # Database — Supabase pooler (transaction mode, port 6543)
      - key: DATABASE_URL
        sync: false
        value: postgresql+asyncpg://postgres.YOUR_REF:YOUR_PASSWORD@aws-0-us-east-1.pooler.supabase.com:6543/postgres

      # Upstash Redis (HTTP REST API)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Cloudflare R2 (S3-compatible storage)
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
        value: quantflow-uploads

      # Auth
      - key: JWT_SECRET
        sync: false
        generateValue: true

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Resend email
      - key: RESEND_API_KEY
        sync: false

      # Sentry
      - key: SENTRY_DSN
        sync: false

      # Environment
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1

  # Optional: Redis instance (if not using Upstash REST)
  # - type: redis
  #   name: quantflow-redis
  #   plan: free
  #   ipAllowList: []
